<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Indonesian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* A gentle shake animation for wrong answers */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 flex flex-col items-center py-10">

    <div class="w-full max-w-md px-4">
        
        <!-- Header & Navigation -->
        <header class="flex justify-between items-end mb-8">
            <div>
                <h1 class="text-2xl font-bold text-slate-900" id="app-title">Today's Words</h1>
                <p class="text-sm text-slate-500 mt-1" id="date-display"></p>
            </div>
          <button id="toggle-day-btn" class="text-sm font-medium text-red-700 hover:text-red-900 transition-colors bg-red-100 px-3 py-1.5 rounded-full">
                Review Yesterday
            </button>
        </header>

        <!-- Progress Bar -->
        <div class="mb-6">
            <div class="flex justify-between text-sm font-medium text-slate-500 mb-2">
                <span id="progress-text">Word 1 of 10</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-2">
                <div id="progress-bar" class="bg-red-600 h-2 rounded-full transition-all duration-300" style="width: 10%"></div>
            </div>        
        </div>

        <!-- Flashcard Area -->
        <div id="flashcard" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center transition-all">
            
            <p class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-2">Translate this word</p>
            <h2 id="indo-word" class="text-5xl font-bold text-slate-900 mb-8 tracking-tight">Makan</h2>

            <!-- Input Form -->
            <form id="answer-form" class="relative max-w-xs mx-auto">
                <input 
                    type="text" 
                    id="user-input" 
                   class="w-full text-center text-xl p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:outline-none focus:border-red-600 focus:bg-white transition-colors"
                    placeholder="Type in English..."
                    autocomplete="off"
                >
                <p id="error-message" class="text-red-500 text-sm font-medium mt-3 hidden opacity-0 transition-opacity">Not quite! Try again.</p>
               <button type="submit" id="submit-btn" class="w-full mt-4 bg-red-700 text-white font-semibold py-4 rounded-xl hover:bg-red-800 transition-colors shadow-md">
                    Check Answer
                </button>
                <button type="button" id="dont-know-btn" class="w-full mt-3 text-slate-500 text-sm font-medium hover:text-slate-700 transition-colors">
                    I don't know
                </button>
            </form>

            <!-- Success State (Hidden by default) -->
            <div id="success-state" class="hidden mt-4">
                <div id="answer-icon-container" class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-green-100 text-green-600 mb-4">
                    <svg id="answer-icon-svg" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h3 class="text-2xl font-bold text-green-600 mb-1" id="correct-answer-display">To Eat</h3>
                <div class="bg-slate-50 rounded-lg p-4 mt-4 border border-slate-100">
                    <p class="text-slate-500 text-sm font-medium uppercase tracking-wider mb-1">Example</p>
                    <p class="text-lg text-slate-800 italic" id="example-sentence">"Saya mau makan nasi."</p>
                </div>
               <button id="next-btn" class="w-full mt-6 bg-red-700 text-white font-semibold py-4 rounded-xl hover:bg-red-800 transition-colors shadow-md">
                    Next Word
                </button>
            </div>

        </div>

        <!-- Completion State (Hidden by default) -->
        <div id="completion-state" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center">
            <h2 class="text-3xl font-bold text-slate-900 mb-4">Great Job! 🎉</h2>
            <p class="text-slate-600 mb-6">You've completed this list of words.</p>
            <button id="restart-btn" class="w-full bg-slate-900 text-white font-semibold py-4 rounded-xl hover:bg-slate-800 transition-colors shadow-md">
                Practice Again
            </button>
        </div>

    </div>

    <script>
        // 1. Database variable (starts empty)
let vocabularyDB = [];

// 2. Fetch the data from the external file
fetch('words.json')
    .then(response => response.json())
    .then(data => {
        vocabularyDB = data;
        loadWordList(); // Initialize the app AFTER data is loaded
    })
    .catch(error => {
        console.error("Error loading words:", error);
        document.getElementById('app-title').innerText = "Database Error";
    });

// ... (Keep all your other functions below: getWordsForDateOffset, isAnswerCorrect, etc.) ...
// Note: Remove the line "loadWordList();" from the very bottom of your script 
// because we are now calling it inside the fetch function above.
        
        // 2. Application State Variables
        let currentWords = [];
        let currentIndex = 0;
        let correctCount = 0;
        let currentWordSkipped = false;
        let isReviewingYesterday = false;
        const wordsPerDay = 10;

        // 3. UI Elements
        const ui = {
            title: document.getElementById('app-title'),
            dateDisplay: document.getElementById('date-display'),
            toggleBtn: document.getElementById('toggle-day-btn'),
            progressText: document.getElementById('progress-text'),
            progressBar: document.getElementById('progressBar'),
            flashcard: document.getElementById('flashcard'),
            indoWord: document.getElementById('indo-word'),
            form: document.getElementById('answer-form'),
            userInput: document.getElementById('user-input'),
            errorMessage: document.getElementById('error-message'),
            submitBtn: document.getElementById('submit-btn'),
            dontKnowBtn: document.getElementById('dont-know-btn'),
            successState: document.getElementById('success-state'),
            correctAnswerDisplay: document.getElementById('correct-answer-display'),
            exampleSentence: document.getElementById('example-sentence'),
            nextBtn: document.getElementById('next-btn'),
            completionState: document.getElementById('completion-state'),
            restartBtn: document.getElementById('restart-btn'),
            progressBar: document.getElementById('progress-bar')
        };

        // 4. Date Math Logic (Selecting the daily words)
        function getWordsForDateOffset(offsetDays) {
            const now = new Date();
            // Calculate total days since standard epoch (Jan 1 1970)
            const daysSinceEpoch = Math.floor(now.getTime() / (1000 * 60 * 60 * 24)) + offsetDays;
            
            // Format the date for the display header
            const targetDate = new Date(now);
            targetDate.setDate(now.getDate() + offsetDays);
            const dateString = targetDate.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            
            // Use Math to select a slice of 10 words consistently based on the day
            // We use modulo to ensure we loop back to the start if we run out of words in the DB
            const startIndex = (daysSinceEpoch * wordsPerDay) % vocabularyDB.length;
            
            // Handle wrapping around the array safely
            let selected = [];
            for (let i = 0; i < wordsPerDay; i++) {
                // Ensure negative module doesn't break logic (though epoch is large positive)
                const safeIndex = (startIndex + i + vocabularyDB.length) % vocabularyDB.length;
                selected.push(vocabularyDB[safeIndex]);
            }

            return { words: selected, dateStr: dateString };
        }

        // 5. Forgiveness Logic (String Matching)
        function isAnswerCorrect(input, correct) {
            // Helper function to clean a string
            const clean = (str) => {
                return str.toLowerCase()
                          .replace(/^to\s+/, '') // Removes "to " at the start
                          .replace(/[^\w\s]/g, '') // Removes punctuation
                          .trim(); // Removes accidental spaces on ends
            };
            
            return clean(input) === clean(correct);
        }

        // 6. UI Update Functions
        function loadWordList() {
            const offset = isReviewingYesterday ? -1 : 0;
            const data = getWordsForDateOffset(offset);
            
            // Clone the array so we can safely add skipped words to the end
            currentWords = [...data.words];
            currentIndex = 0;
            correctCount = 0;
            
            ui.title.innerText = isReviewingYesterday ? "Yesterday's Review" : "Kata Daily";
            ui.dateDisplay.innerText = data.dateStr;
            ui.toggleBtn.innerText = isReviewingYesterday ? "Back to Today" : "Review Yesterday";
            
            ui.completionState.classList.add('hidden');
            ui.flashcard.classList.remove('hidden');
            
            showCurrentWord();
        }

        function showCurrentWord() {
            currentWordSkipped = false;
            const wordData = currentWords[currentIndex];
            
            // Reset UI
            ui.indoWord.innerText = wordData.indo;
            ui.userInput.value = '';
            ui.userInput.focus();
            ui.errorMessage.classList.add('hidden', 'opacity-0');
            
            // Hide success state, show form
            ui.successState.classList.add('hidden');
            ui.form.classList.remove('hidden');
            
            updateProgress();
        }

        function updateProgress() {
            // Calculate progress based on correct answers, not current index
            const displayNum = Math.min(correctCount + 1, wordsPerDay);
            ui.progressText.innerText = `Word ${displayNum} of ${wordsPerDay}`;
            ui.progressBar.style.width = `${(correctCount / wordsPerDay) * 100}%`;
        }

        function showAnswerState(isCorrect) {
            const currentData = currentWords[currentIndex];
            ui.form.classList.add('hidden');
            ui.successState.classList.remove('hidden');

            const iconContainer = document.getElementById('answer-icon-container');
            const iconSvg = document.getElementById('answer-icon-svg');

            if (isCorrect) {
                // Green styling for getting it right
                iconContainer.className = "inline-flex items-center justify-center w-12 h-12 rounded-full bg-green-100 text-green-600 mb-4";
                iconSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>';
                ui.correctAnswerDisplay.className = "text-2xl font-bold text-green-600 mb-1";
            } else {
                // Blue "learning" styling for skipping
                iconContainer.className = "inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-100 text-blue-600 mb-4";
                iconSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>';
                ui.correctAnswerDisplay.className = "text-2xl font-bold text-blue-600 mb-1";
            }

            ui.correctAnswerDisplay.innerText = currentData.en;
            ui.exampleSentence.innerText = `"${currentData.sentence}"`;
            ui.nextBtn.focus();
        }

        // 7. Event Listeners
        ui.form.addEventListener('submit', (e) => {
            e.preventDefault();
            const inputVal = ui.userInput.value;
            const currentData = currentWords[currentIndex];

            if (isAnswerCorrect(inputVal, currentData.en)) {
                // Correct! Increment score and show green success
                correctCount++;
                updateProgress(); // Animate progress bar instantly
                showAnswerState(true);
            } else {
                // Wrong! Trigger shake animation
                ui.errorMessage.classList.remove('hidden');
                // Small delay to allow transition
                setTimeout(() => ui.errorMessage.classList.remove('opacity-0'), 10);
                
                ui.userInput.classList.add('border-red-500', 'shake-animation');
                
                // Remove animation class after it finishes so it can be triggered again
                setTimeout(() => {
                    ui.userInput.classList.remove('shake-animation');
                }, 400);
            }
        });

        // Clear error on typing
        ui.userInput.addEventListener('input', () => {
            ui.errorMessage.classList.add('hidden', 'opacity-0');
            ui.userInput.classList.remove('border-red-500');
        });

        ui.dontKnowBtn.addEventListener('click', () => {
            // Mark as skipped and show blue learning state
            currentWordSkipped = true;
            showAnswerState(false);
        });

        ui.nextBtn.addEventListener('click', () => {
            // If they skipped it, push the current word to the very end of the list
            if (currentWordSkipped) {
                currentWords.push(currentWords[currentIndex]);
            }

            currentIndex++;
            
            // Loop until we reach the end of the dynamically sized array
            if (currentIndex < currentWords.length) {
                showCurrentWord();
            } else {
                // Finished!
                ui.flashcard.classList.add('hidden');
                ui.completionState.classList.remove('hidden');
            }
        });

        ui.toggleBtn.addEventListener('click', () => {
            isReviewingYesterday = !isReviewingYesterday;
            loadWordList();
        });

        ui.restartBtn.addEventListener('click', () => {
            loadWordList();
        });

        // Initialize the app on load
        loadWordList();

    </script>
</body>
</html>
